name: Update Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-dark&hide_border=true&area=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile metrics"
            git push
          fi
